<div class="all-requests-container">
  <div class="header-section">
    <h2>All Requests</h2>
    <button class="refresh-btn" (click)="refreshRequests()" [disabled]="loading">
      <span *ngIf="!loading">Refresh</span>
      <span *ngIf="loading">Loading...</span>
    </button>
  </div>

  <div class="filters-section" *ngIf="!loading && !error">
    <div class="filter-row">
      <div class="filter-group">
        <label>Search:</label>
        <input type="text" 
               [(ngModel)]="searchText" 
               (input)="onFilterChange()"
               placeholder="Search by property data...">
      </div>
      
      <div class="filter-group">
        <label>Status:</label>
        <select [(ngModel)]="statusFilter" (change)="onFilterChange()">
          <option value="">All Statuses</option>
          <option *ngFor="let status of availableStatuses" [value]="status">
            {{ status.name }}
          </option>
        </select>
      </div>
      
      <div class="filter-group">
        <label>Type:</label>
        <select [(ngModel)]="typeFilter" (change)="onFilterChange()">
          <option value="">All Types</option>
          <option *ngFor="let type of availableTypes" [value]="type">
            {{ type.name }}
          </option>
        </select>
      </div>
      
      <div class="filter-group">
        <button class="clear-btn" (click)="clearFilters()">Clear Filters</button>
      </div>
    </div>
    
    <div class="results-count">
      Showing {{ requests.length }} requests
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <p>Loading requests...</p>
  </div>

  <div *ngIf="error" class="error-container">
    <p class="error-message">{{ error }}</p>
    <button class="retry-btn" (click)="refreshRequests()">Retry</button>
  </div>

  <div *ngIf="!loading && !error" class="requests-list">
    <div *ngIf="requests.length === 0" class="no-requests">
      <p>No requests found.</p>
    </div>

    <div *ngIf="requests.length > 0" class="requests-grid">
      <app-request-card 
        *ngFor="let request of requests; trackBy: trackByRequestId"
        [request]="request">
      </app-request-card>
    </div>
  </div>
</div>

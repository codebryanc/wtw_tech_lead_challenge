<div class="all-requests-container">
  <div class="header-section">
    <h2>All Requests</h2>
    <div class="header-actions">
      <button class="new-request-btn" (click)="showNewRequestForm()" type="button">
        New Request
      </button>
      <button class="refresh-btn" (click)="refreshRequests()" [disabled]="loading">
        <span *ngIf="!loading">Refresh</span>
        <span *ngIf="loading">Loading...</span>
      </button>
    </div>
  </div>

  <!-- New Request Form -->
  <div *ngIf="showNewRequest" class="new-request-section">
    <div class="new-request-header">
      <h3>Create New Request</h3>
      <button class="close-btn" (click)="hideNewRequestForm()" type="button">
        ×
      </button>
    </div>
    <app-new-request (requestCreated)="onRequestCreated()"></app-new-request>
  </div>

  <!-- Existing content - only show when not creating new request -->
  <div *ngIf="!loading && !error && !showNewRequest">
    <app-filter-request 
      (filtersChanged)="onFiltersChanged($event)"
      (filtersCleared)="onFiltersCleared()">
    </app-filter-request>
    
    <div class="results-count">
      Showing {{ filteredRequests.length }} of {{ requests.length }} requests
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <p>Loading requests...</p>
  </div>

  <div *ngIf="error" class="error-container">
    <p class="error-message">{{ error }}</p>
    <button class="retry-btn" (click)="refreshRequests()">Retry</button>
  </div>

  <div *ngIf="!loading && !error && !showNewRequest" class="requests-list">
    <div *ngIf="filteredRequests.length === 0 && requests.length === 0" class="no-requests">
      <p>No requests found.</p>
    </div>
    
    <div *ngIf="filteredRequests.length === 0 && requests.length > 0" class="no-results">
      <p>No requests match the current filters.</p>
    </div>

    <div *ngIf="filteredRequests.length > 0" class="requests-grid">
      <app-request-card 
        *ngFor="let request of filteredRequests; trackBy: trackByRequestId"
        [request]="request">
      </app-request-card>
    </div>
  </div>
</div>

<div class="filters-section">
  <div class="filter-row">
    <div class="filter-group">
      <label>Search:</label>
      <input type="text" 
             [(ngModel)]="searchText" 
             (input)="onFilterChange()"
             placeholder="Search by property data (min 3 chars)...">
    </div>
    
    <div class="filter-group">
      <label>Status:</label>
      <select [(ngModel)]="statusFilter" (change)="onFilterChange()">
        <option value="">All Statuses</option>
        <option *ngFor="let status of availableStatuses" [value]="status.resId">
          {{ status.name }}
        </option>
      </select>
    </div>
    
    <div class="filter-group">
      <label>Type:</label>
      <select [(ngModel)]="typeFilter" (change)="onFilterChange()">
        <option value="">All Types</option>
        <option *ngFor="let type of availableTypes" [value]="type.rtyId">
          {{ type.name }}
        </option>
      </select>
    </div>
    
    <div class="filter-group">
      <button class="clear-btn" (click)="clearFilters()">Clear Filters</button>
    </div>
  </div>
</div>
